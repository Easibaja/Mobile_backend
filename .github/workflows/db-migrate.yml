name: Apply DB migrations

# When a PR is MERGED, apply Prisma migrations to the matching Railway standing environment:
#   merged into `dev`  -> Railway development database
#   merged into `main` -> Railway production database
#
# DATABASE URLs come from GitHub secrets (each environment's Railway DATABASE_PUBLIC_URL):
#   DEV_DATABASE_URL, PROD_DATABASE_URL
#
# PR (preview) environments are migrated manually: grab the PR env's public DB URL from
# Railway, set DATABASE_URL locally, and run `npm run db:migrate`.

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

jobs:
  migrate:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Check out the base branch at its post-merge state (it now contains the merged migrations).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # migrate deploy needs the prisma CLI + migration files, not the generated client,
      # so skip postinstall (prisma generate).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply migrations to development
        if: github.event.pull_request.base.ref == 'dev'
        env:
          DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
        run: npm run db:migrate

      - name: Apply migrations to production
        if: github.event.pull_request.base.ref == 'main'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: npm run db:migrate
